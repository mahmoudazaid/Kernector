name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      promote_stable:
        description: "Promote built tags to stable after tests"
        type: boolean
        default: true

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/mahmoudazaid/kernector-api
  WEB_IMAGE: ghcr.io/mahmoudazaid/kernector-web

jobs:
  test:
    name: Required tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Pytest (focused deploy + migrate)
        run: |
          uv run pytest \
            test/composition/test_migrate_sqlite.py \
            test/presentation/cli/test_migrate_sqlite_cli.py \
            test/deploy/test_compose_distribution.py \
            -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install + test + build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  publish:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      promote_stable: ${{ steps.meta.outputs.promote_stable }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        run: |
          sha="sha-${GITHUB_SHA::12}"
          echo "sha_tag=$sha" >> "$GITHUB_OUTPUT"
          tags_api="${API_IMAGE}:$sha"
          tags_web="${WEB_IMAGE}:$sha"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
            tags_api="$tags_api,${API_IMAGE}:$ver"
            tags_web="$tags_web,${WEB_IMAGE}:$ver"
          fi
          promote=false
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            promote=true
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.promote_stable }}" == "true" ]]; then
            promote=true
          fi
          if [[ "$promote" == "true" ]]; then
            tags_api="$tags_api,${API_IMAGE}:stable"
            tags_web="$tags_web,${WEB_IMAGE}:stable"
          fi
          echo "promote_stable=$promote" >> "$GITHUB_OUTPUT"
          echo "tags_api=$tags_api" >> "$GITHUB_OUTPUT"
          echo "tags_web=$tags_web" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags_api }}
          cache-from: type=gha,scope=kernector-api
          cache-to: type=gha,mode=max,scope=kernector-api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            NEXT_PUBLIC_APP_NAME=Kernector
          tags: ${{ steps.meta.outputs.tags_web }}
          cache-from: type=gha,scope=kernector-web
          cache-to: type=gha,mode=max,scope=kernector-web

  compose-smoke:
    name: Compose smoke
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published images and smoke
        env:
          SMOKE_TAG_A: ${{ needs.publish.outputs.sha_tag }}
          SMOKE_TAG_B: ${{ needs.publish.outputs.sha_tag }}
          SMOKE_SKIP_BUILD: "1"
        run: |
          chmod +x scripts/compose-smoke.sh
          docker pull "${{ env.API_IMAGE }}:${SMOKE_TAG_A}"
          docker pull "${{ env.WEB_IMAGE }}:${SMOKE_TAG_A}"
          scripts/compose-smoke.sh
