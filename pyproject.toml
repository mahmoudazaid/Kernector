[project]
name = "kernector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.128.0",
    "fpdf2>=2.8.8",
    "langchain-core>=1.5.4",
    "langchain-openai>=1.5.0",
    "numpy>=2.5.1",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "uvicorn>=0.40.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
